# Lokale, nicht oeffentliche Testinstanz.
port = 30000
bind_address = 0.0.0.0
server_name = marghls dumpster fire (lokale Wiederherstellung)
server_description = Lokale, nicht oeffentliche Testinstanz
server_announce = false
max_users = 8
enable_ipv6 = false
static_spawnpoint = (2401,11,-904)

max_simultaneous_block_sends_per_client = 12
max_block_send_distance = 8
block_send_optimize_distance = 3
active_object_send_range_blocks = 5
active_block_range = 3
map_compression_level_net = 3
dedicated_server_step = 0.05
server_map_save_interval = 15

disallow_empty_password = false
default_privs = interact, shout
enable_damage = true
creative_mode = true
enable_tnt = false
secure.enable_security = true
debug_log_level = action
chat_log_level = action

bones_mode = keep
secure.http_mods = blockexchange,mapserver,lore

# Automatisch aus config/mods/*/settings.conf erzeugt.
hyperloop_wifi_enabled = true
jumpdrive.allow_emerge = true
lore.wiki_api_url = http://mediawiki/rest.php/lorebridge/v1/tickets
lore.wiki_public_url = http://localhost:8082
lore.server_id = dumpster-fire
mesecon.luacontroller_lightweight_interrupts = true
mesecon.mvps_protection_mode = normal
pipeworks_enable_teleport_tube = false
pipeworks_use_real_entities = false
pipeworks_lua_tube_print_behavior = noop
