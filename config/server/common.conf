# Gemeinsame Einstellungen fuer lokale und produktive Instanzen.
port = 30000
bind_address = 0.0.0.0
max_users = 8
enable_ipv6 = false
static_spawnpoint = (2401,11,-904)

max_simultaneous_block_sends_per_client = 12
max_block_send_distance = 8
block_send_optimize_distance = 3
active_object_send_range_blocks = 5
active_block_range = 3
map_compression_level_net = 3
dedicated_server_step = 0.05
server_map_save_interval = 15

default_privs = interact, shout
enable_damage = true
enable_tnt = false
secure.enable_security = true
debug_log_level = action
chat_log_level = action
bones_mode = keep
